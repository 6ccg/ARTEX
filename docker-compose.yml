services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - default
      - isolated

  egress:
    image: 6ccg/artex-egress:local
    build:
      context: .
      target: egress
    cap_add:
      - NET_ADMIN
    security_opt:
      - systempaths=unconfined
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      default:
      isolated:
        ipv4_address: 172.30.254.2
        ipv6_address: fd30:254::2
    healthcheck:
      test: ["CMD", "/usr/local/bin/artex", "-egress-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  artex:
    image: 6ccg/artex:${ARTEX_TAG:-local}
    build:
      context: .
      target: artex
    depends_on:
      postgres:
        condition: service_healthy
      egress:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      ARTEX_EGRESS_URL: http://172.30.254.2:8790
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      - type: bind
        source: ./jwt.key
        target: /app/jwt.key
        bind:
          create_host_path: false
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - SETPCAP
    sysctls:
      net.ipv4.conf.all.route_localnet: "1"
    dns:
      - 172.30.255.2
    networks:
      - isolated

networks:
  isolated:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.254.0/24
        - subnet: fd30:254::/64

volumes:
  pgdata:
